name: Build Fire TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project:"
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          cat > /tmp/targets.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }

                  tasks.configureEach { task ->
                      if (task.name.toLowerCase().contains('kotlin')) {
                          if (task.hasProperty('kotlinOptions')) {
                              task.kotlinOptions.jvmTarget = '17'
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: gradle -I /tmp/targets.gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BrightnessBoosterPro-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
